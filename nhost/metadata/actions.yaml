actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/triggerWorkflowRun'
      forward_client_headers: true
    permissions:
      - role: user
    comment: Trigger a workflow run for the given workflow_id

  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/approveStep'
      forward_client_headers: true
    permissions:
      - role: user
    comment: Approve a paused step_run and resume the workflow

  - name: webhookTriggerWorkflow
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/webhookTrigger'
      forward_client_headers: false
    permissions:
      - role: public
    comment: Trigger a workflow via an inbound webhook (token-authenticated)

custom_types:
  objects:
    - name: WorkflowRunResult
      fields:
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
        - name: message
          type: String

    - name: ApproveStepResult
      fields:
        - name: step_run_id
          type: uuid!
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
        - name: message
          type: String
