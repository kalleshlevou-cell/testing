- table:
    name: organizations
    schema: public
  array_relationships:
    - name: org_members
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            name: org_members
            schema: public
    - name: workflows
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            name: workflows
            schema: public
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - name
          - quota_calls_used
          - quota_calls_allowed
          - quota_period_start
          - created_at
          - updated_at
        filter:
          id:
            _in:
              _select:
                columns:
                  - org_id
                table:
                  name: org_members
                  schema: public
                where:
                  user_id:
                    _eq: X-Hasura-User-Id
  update_permissions:
    - role: user
      permission:
        columns:
          - name
          - quota_calls_allowed
        filter:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
        check: {}

- table:
    name: org_members
    schema: public
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
    - name: user
      using:
        foreign_key_constraint_on: user_id
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - org_id
          - user_id
          - role
          - created_at
        filter:
          org_id:
            _in:
              _select:
                columns:
                  - org_id
                table:
                  name: org_members
                  schema: public
                where:
                  user_id:
                    _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        columns:
          - org_id
          - user_id
          - role
        check:
          _and:
            - org_id:
                _in:
                  _select:
                    columns:
                      - org_id
                    table:
                      name: org_members
                      schema: public
                    where:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in:
                              - owner
  delete_permissions:
    - role: user
      permission:
        filter:
          org_id:
            _in:
              _select:
                columns:
                  - org_id
                table:
                  name: org_members
                  schema: public
                where:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - owner

